<div class="app-layout">
  <app-sidebar
    [mobileOpen]="mobileMenuOpen"
    (closeMobile)="closeMobileMenu()">
  </app-sidebar>

  @if (mobileMenuOpen) {
    <div class="sidebar-overlay" (click)="closeMobileMenu()"></div>
  }

  <div class="main-wrapper">
    <app-navbar (menuToggle)="toggleMobileMenu()"></app-navbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer" aria-label="Informations de la plateforme">
      <span>© 2026 Groupe Scolaire Privé Sciences et Lettres</span>
      <span>Plateforme web sécurisée <span class="footer-separator" aria-hidden="true">•</span> Développée par <strong>Nassim LAGHOUB</strong></span>
    </footer>
  </div>
</div>
