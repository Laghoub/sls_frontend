<div class="activation"><div class="box"><img src="assets/logo.png" alt="Logo"><div *ngIf="loading()">Vérification du lien...</div><div *ngIf="!loading() && !success()"><h1>Activer mon compte</h1><p *ngIf="status() as s">Bonjour <b>{{s.firstName}} {{s.lastName}}</b>. Votre identifiant de connexion est :</p><div class="mat" *ngIf="status() as s">{{s.matricule}}</div><label>Nouveau mot de passe</label><input type="password" [(ngModel)]="password" placeholder="8 caractères minimum"><label>Confirmer le mot de passe</label><input type="password" [(ngModel)]="confirm"><div class="err" *ngIf="error()">{{error()}}</div><button (click)="submit()" [disabled]="!status()">Activer mon compte</button></div><div *ngIf="success()"><h1>Compte activé ✓</h1><p>Votre mot de passe a été créé. Connectez-vous avec votre matricule.</p><button (click)="login()">Se connecter</button></div><div class="err" *ngIf="!loading() && !status() && error()">{{error()}}</div></div></div>
