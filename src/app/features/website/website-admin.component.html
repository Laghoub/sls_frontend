<div class="cms"><div class="heading"><div><h1>Gestion du site web</h1><p>Contenus bilingues · actualités · galerie</p></div><a routerLink="/" target="_blank">Voir le site public ↗</a></div><p class="notice" *ngIf="message">{{message}}</p><p class="error" *ngIf="error">{{error}}</p><div class="tabs"><button [class.active]="tab==='content'" (click)="tab='content'">Pages & présentation</button><button [class.active]="tab==='news'" (click)="tab='news'">Actualités</button><button [class.active]="tab==='gallery'" (click)="tab='gallery'">Galerie photo</button></div>
<div *ngIf="tab==='content'"><article class="editor" *ngFor="let x of content"><h3>{{x.content_key}}</h3><div class="grid"><label>Titre français<input [(ngModel)]="x.title_fr"></label><label>العنوان بالعربية<input dir="rtl" [(ngModel)]="x.title_ar"></label><label>Texte français<textarea rows="4" [(ngModel)]="x.body_fr"></textarea></label><label>النص بالعربية<textarea rows="4" dir="rtl" [(ngModel)]="x.body_ar"></textarea></label></div><label>URL de l'image<input [(ngModel)]="x.image_url" placeholder="/api/website/public/media/..."></label><label class="upload">Importer une image <input type="file" accept="image/jpeg,image/png,image/webp" (change)="upload($event,x)"></label><img *ngIf="x.image_url" class="preview" [src]="x.image_url"><div class="actions"><label><input type="checkbox" [(ngModel)]="x.published"> Publié</label><button [disabled]="busy" (click)="saveContent(x)">Enregistrer</button></div></article></div>
<div *ngIf="tab==='news'"><button class="add" (click)="newNews()">+ Nouvelle actualité</button><article class="editor" *ngFor="let x of news"><div class="grid"><label>Titre français<input [(ngModel)]="x.title_fr"></label><label>العنوان بالعربية<input dir="rtl" [(ngModel)]="x.title_ar"></label><label>Contenu français<textarea rows="4" [(ngModel)]="x.body_fr"></textarea></label><label>المحتوى بالعربية<textarea rows="4" dir="rtl" [(ngModel)]="x.body_ar"></textarea></label></div><label>URL de l'image<input [(ngModel)]="x.image_url"></label><label class="upload">Importer une image<input type="file" accept="image/jpeg,image/png,image/webp" (change)="upload($event,x)"></label><img *ngIf="x.image_url" class="preview" [src]="x.image_url"><div class="actions"><label><input type="checkbox" [(ngModel)]="x.published"> Publié</label><button [disabled]="busy" (click)="saveNews(x)">Enregistrer</button><button class="danger" (click)="removeNews(x)">Supprimer</button></div></article></div>
<div *ngIf="tab==='gallery'"><button class="add" (click)="newPhoto()">+ Ajouter une photo</button><article class="editor" *ngFor="let x of photos"><div class="grid"><label>Titre français<input [(ngModel)]="x.title_fr"></label><label>العنوان بالعربية<input dir="rtl" [(ngModel)]="x.title_ar"></label><label>Catégorie<input [(ngModel)]="x.category"></label><label>Ordre d'affichage<input type="number" [(ngModel)]="x.sort_order"></label></div><label>URL de l'image<input [(ngModel)]="x.image_url"></label><label class="upload">Importer une image<input type="file" accept="image/jpeg,image/png,image/webp" (change)="upload($event,x)"></label><img *ngIf="x.image_url" class="preview" [src]="x.image_url"><div class="actions"><label><input type="checkbox" [(ngModel)]="x.published"> Publié</label><button [disabled]="busy" (click)="savePhoto(x)">Enregistrer</button><button class="danger" (click)="removePhoto(x)">Supprimer</button></div></article></div></div>
