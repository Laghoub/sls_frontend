<div class="portal-page"><div class="page-head"><div><span class="eyebrow">PÉDAGOGIE</span><h1>Mes exercices</h1></div><button class="btn btn-gold" (click)="newOne()"><i class="bi bi-plus-lg"></i> Nouvel exercice</button></div><div class="error" *ngIf="error">{{error}}</div><div class="grid grid-3"><article class="card" *ngFor="let x of rows"><span class="badge">{{x.status}}</span><h3>{{x.title}}</h3><p class="muted">{{x.classGroupName}} · {{x.subjectName}}</p><p>{{x.description||'Aucune description'}}</p><small *ngIf="x.dueDate">À rendre le {{x.dueDate|date:'dd/MM/yyyy'}}</small><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" (click)="edit(x)">Modifier</button><button class="btn btn-danger" (click)="remove(x)">Supprimer</button></div></article></div><div class="modal-backdrop" *ngIf="show"><div class="modal"><h2>{{form.id?'Modifier':'Nouvel'}} exercice</h2><div class="grid grid-2"><div class="field"><label>Classe / matière</label><select [(ngModel)]="form.teachingAssignmentId"><option [ngValue]="0">Sélectionner</option><option *ngFor="let a of assignments" [ngValue]="a.assignmentId">{{a.classGroupName}} · {{a.subjectName}}</option></select></div><div class="field"><label>Date limite</label><input type="date" [(ngModel)]="form.dueDate"></div><div class="field" style="grid-column:1/-1"><label>Titre</label><input [(ngModel)]="form.title"></div><div class="field" style="grid-column:1/-1"><label>Description</label><textarea rows="3" [(ngModel)]="form.description"></textarea></div><div class="field" style="grid-column:1/-1"><label>Consignes</label><textarea rows="3" [(ngModel)]="form.instructions"></textarea></div><div class="field"><label>Statut</label><select [(ngModel)]="form.status"><option value="DRAFT">Brouillon</option><option value="PUBLISHED">Publié</option><option value="ARCHIVED">Archivé</option></select></div></div><div class="modal-actions"><button class="btn" (click)="show=false">Annuler</button><button class="btn btn-gold" [disabled]="!form.title||!form.teachingAssignmentId" (click)="save()">Enregistrer</button></div></div></div></div>
