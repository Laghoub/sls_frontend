<div class="portal-page"><div class="page-head"><div><span class="eyebrow">ENSEIGNEMENT</span><h1>Mes classes & mes élèves</h1><p class="muted">Uniquement les classes qui vous sont affectées.</p></div></div><div class="error" *ngIf="error">{{error}}</div><div class="grid grid-2"><div class="card"><h3>Mes affectations</h3><div *ngFor="let a of assignments"><button class="btn" style="width:100%;text-align:left;margin:5px 0" [class.btn-gold]="selected?.assignmentId===a.assignmentId" (click)="open(a)">{{a.classGroupName}} · {{a.subjectName}}</button></div><p class="empty" *ngIf="!loading&&!assignments.length">Aucune classe affectée.</p></div><div class="card"><h3>Liste des élèves <span *ngIf="selected">— {{selected.classGroupName}}</span></h3><div class="table-wrap"><table class="table"><thead><tr><th>Matricule</th><th>Nom</th><th>Statut</th></tr></thead><tbody><tr *ngFor="let s of students"><td>{{s.studentNumber}}</td><td><b>{{s.lastName}} {{s.firstName}}</b></td><td><span class="badge">{{s.status}}</span></td></tr></tbody></table></div><p class="empty" *ngIf="selected&&!students.length">Aucun élève.</p></div></div></div>
