<div class="portal-page"><div class="page-head"><div><span class="eyebrow">PLANNING</span><h1>Mon emploi du temps</h1><p class="muted">Vos cours, classes, matières, salles et horaires.</p></div></div><div class="error" *ngIf="error">{{error}}</div><div class="grid" style="grid-template-columns:repeat(5,minmax(180px,1fr));overflow:auto"><section class="card" *ngFor="let d of days"><h3>{{labels[d]}}</h3><div *ngFor="let x of byDay(d)" style="padding:12px 0;border-bottom:1px solid #eee"><b>{{x.startTime.slice(0,5)}} - {{x.endTime.slice(0,5)}}</b><div>{{x.subjectName}}</div><small class="muted">{{x.classGroupName}} <span *ngIf="x.roomName">· {{x.roomName}}</span></small></div><p class="empty" *ngIf="!byDay(d).length">Aucun cours</p></section></div></div>
