server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les requêtes API seront transmises par Caddy
    # directement au backend Spring Boot.
    location /api/ {
        return 404;
    }
}
